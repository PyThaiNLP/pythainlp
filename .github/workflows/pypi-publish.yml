name: Build and publish to PyPI

on:
  push:                 # Use together with "[cd build]" commit message
    branches:
      - dev
      - main
  pull_request:         # Use together with "[cd build]" commit message
    branches:
      - dev
      - main
  release:
    types: [published]  # "Publish release" button
  workflow_dispatch:    # Manual trigger to test wheel build

# Avoid duplicate runs for the same source branch and repository.
# For pull_request events, uses the source repo name from
# github.event.pull_request.head.repo.full_name; otherwise uses github.repository.
# For push events, uses the branch name from github.ref_name.
# For pull_request events, uses the source branch name from github.head_ref.
# This ensures events for the same repo and branch share the same group,
# and avoids cross-fork collisions when branch names are reused.
# Also applies to release (uses tag name) and workflow_dispatch (uses branch/tag name).
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.head.repo.full_name || github.repository
    }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  echo_github_env:
    name: Echo env variables
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - run: |
        echo "github.event.action   : ${{ github.event.action }}"
        echo "github.event_name     : ${{ github.event_name }}"
        echo "github.ref            : ${{ github.ref }}"
        echo "github.ref_type       : ${{ github.ref_type }}"
        echo "github.event.ref      : ${{ github.event.ref }}"

  # Check whether to build the wheels and the source tarball
  check_build_trigger:
    name: Check build trigger
    runs-on: ubuntu-latest
    # Not for forks
    if: github.repository == 'pythainlp/pythainlp'
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check_build_trigger.outputs.build }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - id: check_build_trigger
      name: Check build trigger
      run: bash build_tools/github/check_build_trigger.sh
      # To trigger the build steps, add "[cd build]" to commit message

  build:
    name: Build and check distributions
    needs: [check_build_trigger]
    if: needs.check_build_trigger.outputs.build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    permissions:
      contents: read
    outputs:
      sbom-name: ${{ steps.pitloom.outputs.sbom-path }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        pip install --only-binary :all: "pip==26.2.1"
        pip install --only-binary :all: "build==1.6.1" "twine==7.0.0"

    # Pins every timestamp in the build and the SBOM to the commit time, so a
    # rebuild of the same commit gives the same files, as long as Pitloom's
    # PyPI lookups give the same answers. To recover a failed release, prefer
    # "Re-run failed jobs", which reuses this run's artifacts.
    - name: Set SOURCE_DATE_EPOCH to the commit time
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "${GITHUB_ENV}"

    - name: Build source distribution and wheels
      run: python -m build

    - name: Check distributions
      run: twine check dist/*

    # Embeds after the build, not with Pitloom's Hatchling build hook:
    # Pitloom needs Python 3.10+, but PyThaiNLP still builds from source on
    # Python 3.9, where an unknown build hook fails the build.
    # Pitloom 0.20.0+ lists only the wheel's payload, so the files the
    # embedding rewrites (RECORD and the SBOM itself) are not in the SBOM
    # with stale hashes, as they were with 0.19.0.
    # --verify checks the SBOM is at the PEP 770 location.
    # --validate checks the SBOM against the SPDX 3 schema and SHACL shapes.
    # Either failing fails this step, which stops publishing.
    # The uploaded "sbom" artifact is the SBOM read back from the wheel.
    - name: Generate SBOM, embed into the wheel, and check it
      id: pitloom
      uses: bact/pitloom@3785ee7babe07661b8f0ea92fdb41321b7a88b6b # v0.20.0
      with:
        embed-wheel: "dist/*.whl"
        project-path: "."
        # content-type: magika, set in [tool.pitloom.content-type]
        # onnx: read metadata of the ONNX models in pythainlp/corpus
        # validate: spdx3-validate, for --validate
        extras: "content-type,onnx,validate"
        args: "--verify --validate"
        upload-artifact: "true"
        artifact-name: "sbom"

    # The Pitloom Action sets no sbom-path, without failing, when
    # "dist/*.whl" matches more than one wheel. Fail here instead, so a
    # release never goes out without its SBOM and signatures.
    - name: Check the SBOM was embedded
      env:
        SBOM_NAME: ${{ steps.pitloom.outputs.sbom-path }}
      run: |
        if [ -z "${SBOM_NAME}" ]; then
          echo "::error::Pitloom reported no embedded SBOM"
          exit 1
        fi

    - name: Store distributions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: dist

  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    # Only runs if "build" (including all SBOM checks) succeeded, so a
    # missing, misplaced, or invalid SBOM stops publishing entirely.
    if: needs.build.result == 'success' && github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
    steps:
    - name: Retrieve distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: artifact
        path: dist
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        skip-existing: true
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  attach_release_sbom:
    name: Attach SBOM to GitHub Release
    needs: [build, publish_pypi]
    # Only after PyPI publishing succeeded, so a release never carries an
    # SBOM for a package that was not published.
    if: needs.build.result == 'success' && needs.publish_pypi.result == 'success' && needs.build.outputs.sbom-name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload, for the standalone SBOM asset
    steps:
    - name: Download SBOM artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sbom
        path: sbom
    - name: Attach SBOM to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        SBOM_NAME: ${{ needs.build.outputs.sbom-name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh release upload "${RELEASE_TAG}" "sbom/${SBOM_NAME}" \
          --clobber --repo "${REPO}"

  attach_release_dist:
    name: Attach distribution to GitHub Release
    needs: [build, publish_pypi]
    if: needs.build.result == 'success' && needs.publish_pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload, for the sdist/wheel assets
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: artifact
        path: dist
    - name: Attach sdist and wheel to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh release upload "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz \
          --clobber --repo "${REPO}"

  sign_and_attest:
    name: Sign distributions and SBOM, and attach provenance
    needs: [build, publish_pypi]
    if: needs.build.result == 'success' && needs.publish_pypi.result == 'success' && needs.build.outputs.sbom-name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload, for the signature assets
      id-token: write # Sigstore keyless signing and attestation signing
      attestations: write # actions/attest-build-provenance
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: artifact
        path: dist
    - name: Download SBOM artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sbom
        path: sbom
    - name: Sign distributions and SBOM with Sigstore
      uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
      with:
        inputs: >-
          dist/*.whl dist/*.tar.gz
          sbom/${{ needs.build.outputs.sbom-name }}
        # "true" (default) also downloads and signs GitHub's generated
        # source archives on a release run, and fails if that download fails.
        release-signing-artifacts: "false"
    - name: Generate build provenance attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          dist/*.whl
          dist/*.tar.gz
          sbom/${{ needs.build.outputs.sbom-name }}
    - name: Attach Sigstore bundles to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        REPO: ${{ github.repository }}
        SBOM_NAME: ${{ needs.build.outputs.sbom-name }}
      run: |
        set -euo pipefail
        gh release upload "${RELEASE_TAG}" dist/*.sigstore.json \
          "sbom/${SBOM_NAME}.sigstore.json" --clobber --repo "${REPO}"
