name: Build and publish to PyPI

on:
  push:                 # Use together with "[cd build]" commit message
    branches:
      - dev
  pull_request:         # Use together with "[cd build]" commit message
    branches:
      - dev
  release:
    types: [published]  # "Publish release" button
  workflow_dispatch:    # Manual trigger to test wheel build

# Avoid duplicate runs for the same source branch and repository.
# For pull_request events, uses the source repo name from
# github.event.pull_request.head.repo.full_name; otherwise uses github.repository.
# For push events, uses the branch name from github.ref_name.
# For pull_request events, uses the source branch name from github.head_ref.
# This ensures events for the same repo and branch share the same group,
# and avoids cross-fork collisions when branch names are reused.
# Also applies to release (uses tag name) and workflow_dispatch (uses branch/tag name).
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.head.repo.full_name || github.repository
    }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  echo_github_env:
    name: Echo env variables
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo "github.event.action   : ${{ github.event.action }}"
        echo "github.event_name     : ${{ github.event_name }}"
        echo "github.ref            : ${{ github.ref }}"
        echo "github.ref_type       : ${{ github.ref_type }}"
        echo "github.event.ref      : ${{ github.event.ref }}"

  # Check whether to build the wheels and the source tarball
  check_build_trigger:
    name: Check build trigger
    runs-on: ubuntu-latest
    # Not for forks
    if: github.repository == 'pythainlp/pythainlp'
    outputs:
      build: ${{ steps.check_build_trigger.outputs.build }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - id: check_build_trigger
      name: Check build trigger
      run: bash build_tools/github/check_build_trigger.sh
      # To trigger the build steps, add "[cd build]" to commit message

  build:
    name: Build and check distributions
    needs: [check_build_trigger]
    if: needs.check_build_trigger.outputs.build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    outputs:
      sbom-path: ${{ steps.pitloom.outputs.sbom-path }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install build spdx3-validate twine

    - name: Build source distribution and wheels
      run: python -m build

    - name: Check distributions
      run: twine check dist/*

    - name: Generate SBOM and embed into the wheel
      id: pitloom
      uses: bact/pitloom@4842922f65fb7ed1c5e51507c0fb253c62d97960 # v0.16.2
      with:
        embed-wheel: "dist/*.whl"
        project-path: "."
        upload-artifact: "true"
        artifact-name: "sbom"

    - name: Check SBOM is at the PEP 770 location
      id: locate-sbom
      env:
        SBOM_PATH: ${{ steps.pitloom.outputs.sbom-path }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=(dist/*.whl)
        if [ "${#wheels[@]}" -ne 1 ]; then
          echo "::error::expected exactly one wheel in dist/, found" \
            "${#wheels[@]}: ${wheels[*]}"
          exit 1
        fi
        whl="${wheels[0]}"
        sbom_basename=$(basename "${SBOM_PATH}")

        matched=""
        while IFS= read -r entry; do
          case "${entry}" in
            *.dist-info/sboms/"${sbom_basename}")
              matched="${entry}"
              break
              ;;
          esac
        done < <(unzip -Z1 "${whl}")

        if [ -z "${matched}" ]; then
          echo "::error::${sbom_basename} not found under" \
            "*.dist-info/sboms/ in ${whl}"
          exit 1
        fi
        echo "Found: ${matched}"
        echo "wheel=${whl}" >> "${GITHUB_OUTPUT}"
        echo "entry=${matched}" >> "${GITHUB_OUTPUT}"

    - name: Validate SBOM extracted from the wheel
      env:
        WHEEL: ${{ steps.locate-sbom.outputs.wheel }}
        ENTRY: ${{ steps.locate-sbom.outputs.entry }}
      run: |
        set -euo pipefail
        extracted="$(mktemp -d)/temp-sbom.json"
        unzip -p "${WHEEL}" "${ENTRY}" > "${extracted}"
        spdx3-validate --json "${extracted}"

    - name: Store distributions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: dist

  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    # Only runs if "build" (including all SBOM checks) succeeded, so a
    # missing, misplaced, or invalid SBOM stops publishing entirely.
    if: needs.build.result == 'success' && github.event_name == 'release' && github.event.action == 'published'
    steps:
    - name: Retrieve distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: artifact
        path: dist
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        skip-existing: true
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  attach_release_sbom:
    name: Attach SBOM to GitHub Release
    needs: [build]
    if: needs.build.result == 'success' && needs.build.outputs.sbom-path != '' && github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload, for the standalone SBOM asset
    steps:
    - name: Download SBOM artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sbom
        path: sbom
    - name: Attach SBOM to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        SBOM_BASENAME: ${{ needs.build.outputs.sbom-path }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh release upload "${RELEASE_TAG}" "sbom/${SBOM_BASENAME}" \
          --clobber --repo "${REPO}"

  attach_release_dist:
    name: Attach distribution to GitHub Release
    needs: [build, publish_pypi]
    if: needs.build.result == 'success' && needs.publish_pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload, for the sdist/wheel assets
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: artifact
        path: dist
    - name: Attach sdist and wheel to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh release upload "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz \
          --clobber --repo "${REPO}"
