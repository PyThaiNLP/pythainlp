[project.urls]
homepage = "https://pythainlp.org/"
source = "https://github.com/PyThaiNLP/pythainlp.git"
download = "https://pypi.org/project/pythainlp/#files"
changelog = "https://github.com/PyThaiNLP/pythainlp/blob/dev/CHANGELOG.md"
releasenotes = "https://github.com/PyThaiNLP/pythainlp/releases"
documentation = "https://pythainlp.org/docs/"
issues = "https://github.com/PyThaiNLP/pythainlp/issues"
"Tutorials" = "https://pythainlp.org/tutorials/"

[project.scripts]
thainlp = "pythainlp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pythainlp"]

[tool.hatch.build.targets.sdist]
include = [
    "pythainlp/",
    "tests/",
    "LICENSE",
    "README.md",
]

[tool.bandit]
# Skip tests that produce known false positives or are accepted risks.
# B110: Try/Except/Pass. Accepted pattern in optional-dependency loading.
skips = ["B110"]

[tool.bumpversion]
current_version = "5.4.0"
commit = true
# Tag the merged commit on main by hand (see release.md).
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\-(?P<release>[a-z]+)(?P<build>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}{build}",
    "{major}.{minor}.{patch}",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pythainlp/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = 'version: {current_version}'
replace = 'version: {new_version}'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
regex = true
search = 'date-released: \d{{4}}-\d{{2}}-\d{{2}}'
replace = 'date-released: {now:%Y-%m-%d}'

[[tool.bumpversion.files]]
filename = "codemeta.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "codemeta.json"
regex = true
search = '"dateModified": "\d{{4}}-\d{{2}}-\d{{2}}"'
replace = '"dateModified": "{now:%Y-%m-%d}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = '[{current_version}](https://github.com/PyThaiNLP/pythainlp/releases)'
replace = '[{new_version}](https://github.com/PyThaiNLP/pythainlp/releases)'

[[tool.bumpversion.files]]
filename = "README.md"
search = 'compare/v{current_version}...HEAD'
replace = 'compare/v{new_version}...HEAD'

[[tool.bumpversion.files]]
filename = "README_TH.md"
search = '[{current_version}](https://github.com/PyThaiNLP/pythainlp/releases)'
replace = '[{new_version}](https://github.com/PyThaiNLP/pythainlp/releases)'

[[tool.bumpversion.files]]
filename = "README_TH.md"
search = 'compare/v{current_version}...HEAD'
replace = 'compare/v{new_version}...HEAD'

[tool.bumpversion.parts.release]
optional_value = "prod"
first_value = "dev"
values = ["dev", "beta", "prod"]

# Test coverage expectations:
# - Overall: at least 80%.
# - New and changed code: at least 95%. CI (diff-cover,
#   .github/workflows/unittest.yml) gates it, except in the noauto modules
#   listed in tests/diff-cover-noauto.txt. CI cannot run those, so it only
#   reports them.
# - AI agents: aim at near 100% line and branch coverage of the code they
#   add or change, and cover every function they touch.
[tool.coverage.run]
source = ["pythainlp"]

[[tool.pitloom.creator]]
name = "Wannaphong Phatthiyaphaibun"
email = "wannaphong@pythainlp.org"
type = "person"

# Read by the Pitloom GitHub Action in .github/workflows/pypi-publish.yml.
# "magika" fails the SBOM generation if magika is not installed, instead of
# falling back to guessing from the file extension.
[tool.pitloom.content-type]
enabled = true
method = "magika"

# CRFsuite models: magika has no label for them and guesses STL or NumPy.
# CRFsuite has no registered media type.
[[tool.pitloom.content-type.override]]
pattern = "pythainlp/corpus/*.crfsuite"
content-type = "application/octet-stream"

[[tool.pitloom.content-type.override]]
pattern = "pythainlp/corpus/*.model"
content-type = "application/octet-stream"

# magika detects SQLite, but Pitloom gives application/octet-stream.
[[tool.pitloom.content-type.override]]
pattern = "pythainlp/corpus/*.db"
content-type = "application/vnd.sqlite3"

# Docstring checks run by Codacy (pydocstyle); same as .pydocstyle.ini.
# Summary on the second line (D213) is the project style, so D212 is off.
# D211 is used over D203.
[tool.pydocstyle]
ignore = ["D203", "D212"]

[tool.ruff]
indent-width = 4
line-length = 79
target-version = "py39"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# See the test coverage targets at [tool.coverage.run].
# Flag errors (`C901`) whenever the complexity level exceeds this value.
# The limit is 10. Unrefactored functions carry a `# noqa: C901` marked
# `# phase2-todo`.
mccabe.max-complexity = 10
# flake8 owns the CCR (cognitive complexity) codes; keep their `# noqa`.
external = ["CCR"]
select = [
    "D1",
    "D200",
    "D202",
    "D205",
    "D209",
    "D213",
    "D214",
    "D300",
    "D400",
    "D401",
    "D413",
    "D415",
    "A002",
    "E",
    "EXE001",
    "F",
    "I",
    "ICN001",
    "INP001",
    "W",
    "S",
    "TC",
    "B",
    "BLE001",
    "C4",
    "FA100",
    "FLY002",
    "FURB",
    "ISC",
    "PGH003",
    "PERF401",
    "PERF402",
    "PERF403",
    "PIE",
    "PLE",
    "PLW2901",
    "PYI034",
    "RET",
    "RUF005",
    "RUF012",
    "RUF010",
    "RUF022",
    "RUF100",
    "RUF102",
    "SIM",
    "SLOT000",
    "UP006",
    "UP015",
    "UP031",
    "UP033",
    "UP035",
    "UP037",
    "C901",
    "F401",
    "F811",
    "F841",
    "W291",
    "W293",
]
# Some rules are ignored for now; we can consider enabling them in the future.
# B905 (zip strict=) needs Python 3.10.
# RET504 (assign then return), SIM108 (ternary), and SIM117 (nested with)
# are style choices that often hurt readability.
extend-ignore = ["B905", "E501", "RET504", "SIM108", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# E402: these packages import in a fixed order to avoid circular imports.
"pythainlp/__init__.py" = ["E402"]
"pythainlp/corpus/__init__.py" = ["E402"]
"pythainlp/corpus/wordnet.py" = ["E402"]
"pythainlp/soundex/__init__.py" = ["E402"]
"pythainlp/spell/__init__.py" = ["E402"]
"pythainlp/summarize/__init__.py" = ["E402"]
"pythainlp/tokenize/__init__.py" = ["E402"]
# S101 (assert) is not allowed in production code. Tests and notebooks may use it.
# B010 (setattr) is for attributes that tests set on purpose.
# D1 (missing docstring) applies to the pythainlp package only.
"tests/**" = ["B010", "D1", "S101"]
"notebooks/**" = ["D1", "S101"]
"examples/**" = ["D1", "INP001"]
"build_tools/**" = ["D1"]
"docs/**" = ["D1"]

[tool.tox]
env_list = ["py39", "py310", "py311", "py312", "py313", "py314", "pypy310", "pypy311", "ruff", "flake8", "mypy"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
commands = [["python", "-m", "unittest", "tests.core", "tests.compact"]]
extras = ["compact"]

[tool.tox.env.pypy310]
basepython = "pypy3.10"

[tool.tox.env.pypy311]
basepython = "pypy3.11"

# The lint environments below mirror .github/workflows/lint.yml and mypy.yml.
[tool.tox.env.ruff]
basepython = ["python"]
commands = [
    ["ruff", "check", "--config", "pyproject.toml", "pythainlp", "tests", "examples", "notebooks"],
    ["ruff", "format", "--check", "--config", "pyproject.toml", "pythainlp", "tests", "examples", "notebooks"],
]
deps = ["ruff==0.16.10"]
skip_install = true

[tool.tox.env.flake8]
basepython = ["python"]
commands = [["flake8", "pythainlp"]]
deps = ["flake8==7.4.1", "flake8-cognitive-complexity==0.1.0"]
skip_install = true

[tool.tox.env.mypy]
commands = [["mypy", "pythainlp", "tests"]]
# Same version as mypy.yml. mypy 1.19 is the last release that targets
# Python 3.9; python_version in [tool.mypy] sets the target.
deps = ["mypy==1.19.1"]
extras = []

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
pretty = true
python_version = "3.9"
show_column_numbers = true
show_error_code_links = true
show_error_context = true
strict = true
strict_bytes = true
strict_equality = true
strict_equality_for_none = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Treat optional dependencies as untyped, whether installed or not.
# Without "follow_imports = skip", mypy analyzes installed packages
# (for example, torch) with python_version = "3.9" and fails on
# newer syntax.
[[tool.mypy.overrides]]
module = [
    "attacut.*",
    "attaparse.*",
    "bpemb.*",
    "budoux.*",
    "emoji.*",
    "epitran.*",
    "esupar.*",
    "fairseq.*",
    "fastai.*",
    "fastcoref.*",
    "gensim.*",
    "huggingface_hub.*",
    "icu.*",
    "importlib_resources",
    "importlib_resources.*",
    "khamyo.*",
    "khanaa.*",
    "multiel.*",
    "nltk.*",
    "nlpo3.*",
    "numpy.*",
    "onnx.*",
    "onnxruntime.*",
    "oskut.*",
    "pandas.*",
    "panphon.*",
    "phunspell.*",
    "pycrfsuite.*",
    "pyicu.*",
    "sacremoses.*",
    "sefr_cut.*",
    "sentencepiece.*",
    "sentence_transformers.*",
    "spacy.*",
    "spacy_thai.*",
    "ssg.*",
    "stanza.*",
    "symspellpy.*",
    "thai_nner.*",
    "tltk.*",
    "torch.*",
    "tqdm.*",
    "transformers.*",
    "ufal.*",
    "ufal.chu_liu_edmonds.*",
    "word2word.*",
    "wtpsplit.*",
    "wunsen.*",
    "yaml.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pylint.main]
disable = [
    "import-error",
    "no-name-in-module",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
]
