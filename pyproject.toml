[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythainlp"
version = "5.4.0"
description = "Thai Natural Language Processing library"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Wannaphong Phatthiyaphaibun", email = "wannaphong@pythainlp.org" },
    { name = "Korakot Chaovavanich" },
    { name = "Charin Polpanumas" },
    { name = "Arthit Suriyawongkul", email = "suriyawa@tcd.ie" },
    { name = "Lalita Lowphansirikul" },
    { name = "Pattarawat Chormai" },
    { name = "Peerat Limkonchotiwat" },
    { name = "Thanathip Suntorntip" },
    { name = "Can Udomcharoenchaikit" },
]
maintainers = [
    { name = "Wannaphong Phatthiyaphaibun", email = "wannaphong@pythainlp.org" },
    { name = "Arthit Suriyawongkul", email = "suriyawa@tcd.ie" },
]
keywords = [
    "pythainlp",
    "NLP",
    "natural language processing",
    "tokenization",
    "text processing",
    "linguistics",
    "localization",
    "computational linguistics",
    "ThaiNLP",
    "Thai NLP",
    "Thai language",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Natural Language :: Thai",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Linguistic",
]

# Core dependencies
dependencies = [
    "importlib_resources; python_version < '3.11'",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]

## 1) Development ########################################

dev = [
    # Some tools drop Python 3.9 in newer releases. Use the latest version
    # for each Python range. bandit 1.8.x reports false positives for B615
    # (revision is a variable).
    "bandit>=1.8.6;python_version<'3.10'",
    "bandit>=1.9.4;python_version>='3.10'",
    "build>=1.4.4;python_version<'3.10'",
    "build>=1.6.1;python_version>='3.10'",
    "bump-my-version>=1.5.1",
    "coverage>=7.10.7;python_version<'3.10'",
    "coverage>=7.16.2;python_version>='3.10'",
    "diff-cover>=10.6.0",
    "flake8>=7.3.0;python_version<'3.10'",
    "flake8>=7.4.1;python_version>='3.10'",
    "flake8-cognitive-complexity>=0.1.0",
    # Same as CI. mypy 2.x requires Python 3.10 or later and rejects
    # python_version = "3.9" in [tool.mypy].
    "mypy==1.19.1",
    "pylint>=3.3.9;python_version<'3.10'",
    "pylint>=4.1.2;python_version>='3.10'",
    "ruff>=0.16.10",
    "tox>=4.30.3;python_version<'3.10'",
    "tox>=4.64.9;python_version>='3.10'",
]

docs = [
    "Sphinx>=6.2",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
]

## 2) Feature sets #######################################

abbreviation = ["khamyo>=0.2.0"]

attacut = ["attacut>=1.0.6"]

attaparse = ["attaparse>=1.0.0"]

benchmarks = ["numpy>=1.22", "pandas>=0.24", "PyYAML>=5.4.1"]

budoux = ["budoux>=0.7.0"]

coreference_resolution = ["fastcoref>=2.1.5", "spacy>=3.0"]

dependency_parsing = [
    "attaparse>=1.0.0",
    "spacy_thai>=0.7.1",
    "transformers>=4.22.1",
    "ufal.chu-liu-edmonds>=1.0.2",
]

el = ["multiel>=0.5"]

esupar = ["esupar>=1.3.8", "numpy>=1.22", "transformers>=4.22.1"]

generate = ["fastai<2.0"]

icu = ["pyicu>=2.3"]

ipa = ["epitran>=1.1"]

ml = ["numpy>=1.22", "torch>=1.0.0"]

mt5 = ["sentencepiece>=0.1.91", "transformers>=4.22.1"]

nlpo3 = ["nlpo3>=1.4.0"]

onnx = ["numpy>=1.22", "onnxruntime>=1.10.0", "sentencepiece>=0.1.91"]

oskut = ["oskut>=1.3"]

qwen3 = ["torch>=1.9.0", "transformers>=4.22.1"]

sefr_cut = ["sefr_cut>=1.1"]

spacy_thai = ["spacy_thai>=0.7.1"]

spell = ["phunspell>=0.1.6", "symspellpy>=6.7.6"]

ssg = ["ssg>=0.0.8"]

textaugment = ["bpemb>=0.3.2", "gensim>=4.0.0"]

thai_nner = ["thai_nner>=0.3"]

thai2fit = ["emoji>=0.5.1", "gensim>=4.0.0", "numpy>=1.22"]

thai2rom = ["numpy>=1.22", "torch>=1.0.0"]

translate = [
    'fairseq>=0.10.0,<0.13;python_version<"3.11"',
    'fairseq-fixed==0.12.3.1,<0.13;python_version>="3.11"',
    "sacremoses>=0.0.41",
    "sentencepiece>=0.1.91",
    "torch>=1.0.0",
    "transformers>=4.22.1",
    "word2word>=1.0.0",
]

transformers_ud = ["transformers>=4.22.1", "ufal.chu-liu-edmonds>=1.0.2"]

wangchanberta = ["sentencepiece>=0.1.91", "transformers>=4.22.1"]

wangchanglm = ["pandas>=0.24", "sentencepiece>=0.1.91", "transformers>=4.22.1"]

word_approximation = ["panphon>=0.20.0"]

wordnet = ["nltk>=3.3"]

wsd = ["sentence-transformers>=2.2.2"]

wtp = ["transformers>=4.22.1", "wtpsplit>=1.0.1"]

wunsen = ["wunsen>=0.0.3"]

## 3) Testing ############################################

# Below are dependency groups for each defined test suites

# Compact dependencies - for tests.compact modules
# Safe small set of optional dependencies
# for common tasks like tokenization and tagging.
compact = [
    "nlpo3>=1.4.0",
    "numpy>=1.26.0",
    "pyicu>=2.3",
    "python-crfsuite>=0.9.7",
    "PyYAML>=5.4.1",
]

# Extra dependencies - for tests.extra modules
extra = [
    "bpemb>=0.3.2",
    "budoux>=0.7.0",
    "gensim>=4.0.0",
    "nltk>=3.3",
    "pandas>=0.24",
    "ssg>=0.0.8",
    "symspellpy>=6.7.6",
    # tltk 1.11 pins scikit-learn~=1.2.0, which has no wheel for Python 3.13+
    "tltk>=1.10,!=1.11",
]

# Noauto test dependencies - for tests.noauto_* modules
# These are further grouped by dependency framework to avoid conflicts

# PyTorch-based dependencies - for tests.noauto_torch
noauto-torch = [
    "attacut>=1.0.6",
    "numpy>=1.26.0",
    "sentencepiece>=0.1.91",
    "thai-nner>=0.3",
    # tltk 1.11 pins scikit-learn~=1.2.0, which has no wheel for Python 3.13+
    "tltk>=1.10,!=1.11",
    "torch>=1.13.1",
    "transformers>=4.22.1",
    "wtpsplit>=1.0.1",
]

# TensorFlow-based dependencies - for tests.noauto_tensorflow
noauto-tensorflow = [
    "numpy>=1.26.0",
]

# ONNX Runtime-based dependencies - for tests.noauto_onnx
noauto-onnx = [
    "numpy>=1.26.0",
    "onnxruntime>=1.10.0",
    "oskut>=1.3",
    "sefr_cut>=1.1",
]

# Cython-based dependencies - for tests.noauto_cython
noauto-cython = [
    "phunspell>=0.1.6",
]

# Network-dependent tests - for tests.noauto_network
# These tests require network access but minimal dependencies
noauto-network = [
    "huggingface-hub>=0.16.0",
]

# Full dependencies - pinned where available
full = [
    "attacut==1.0.6",
    "attaparse==1.0.0",
    "bpemb>=0.3.6,<0.4",
    "budoux==0.9.3",
    "epitran==1.35.2",
    "esupar>=1.3.9,<2",
    'fairseq>=0.10.0,<0.13;python_version<"3.11"',
    'fairseq-fixed==0.12.3.1,<0.13;python_version>="3.11"',
    "fastai>=1.0.61,<2",
    "fastcoref==2.1.6",
    "gensim>=4.3.3,<5",
    "khamyo>=0.3.0",
    "khanaa>=0.1.1,<1",
    "nlpo3>=1.4.0",
    "nltk>=3.6.6,<4",
    "numpy>=1.26.0,<3",
    "onnxruntime>=1.10.0",
    "oskut>=1.3",
    "pandas>=2.2.0,<3",
    "panphon==0.22.2",
    "phunspell==0.1.6",
    "pyicu>=2.15.2,<3",
    "python-crfsuite==0.9.12",
    "PyYAML>=5.4.1,<6.0.2",
    "sacremoses==0.1.1",
    "sentence-transformers>=2.7.0,<3",
    "sentencepiece==0.2.2",
    "spacy==3.8.7,<4",
    "spacy_thai==0.7.8",
